name: One-time E3 encrypted secret handoff
on:
  workflow_dispatch:
    inputs:
      destination_key:
        required: true
        type: string
      destination_key_id:
        required: true
        type: string
permissions:
  contents: read
jobs:
  seal:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: e3-lab
    steps:
      - name: Prepare sealed-box encryption
        run: npm install --prefix "$RUNNER_TEMP/e3-seal" --ignore-scripts --no-audit --no-fund libsodium-wrappers@0.7.15 libsodium@0.7.15
      - name: Encrypt for destination environment
        env:
          DESTINATION_KEY: ${{ inputs.destination_key }}
          DESTINATION_KEY_ID: ${{ inputs.destination_key_id }}
          SOURCE_AUTHOR_PASSWORD: ${{ secrets.AUTHOR_PASSWORD }}
          SOURCE_TARGET_PASSWORD: ${{ secrets.TARGET_PASSWORD }}
        run: |
          node <<'JS'
          const fs = require('fs');
          const sodium = require(process.env.RUNNER_TEMP + '/e3-seal/node_modules/libsodium-wrappers');
          (async () => {
            await sodium.ready;
            const key = sodium.from_base64(process.env.DESTINATION_KEY, sodium.base64_variants.ORIGINAL);
            const result = {};
            for (const name of ['AUTHOR_PASSWORD', 'TARGET_PASSWORD']) {
              const value = process.env['SOURCE_' + name];
              if (!value) throw new Error('Source secret is missing: ' + name);
              result[name] = {
                key_id: process.env.DESTINATION_KEY_ID,
                encrypted_value: sodium.to_base64(sodium.crypto_box_seal(value, key), sodium.base64_variants.ORIGINAL)
              };
            }
            fs.writeFileSync(process.env.RUNNER_TEMP + '/e3-sealed-secrets.json', JSON.stringify(result));
          })().catch(() => { console.error('Secret encryption failed'); process.exit(1); });
          JS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: e3-encrypted-secret-handoff
          path: ${{ runner.temp }}/e3-sealed-secrets.json
          retention-days: 1
